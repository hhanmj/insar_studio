name: Release

# Publish Windows desktop builds to a GitHub Release whenever a version tag
# (for example v2.0.1) is pushed. The desktop app checks the latest GitHub
# Release on startup and every hour, so the loop is:
# tag -> build -> release -> users see the update notice.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install web dependencies
        working-directory: ui
        run: npm ci

      # The release exe is the full internal build: desktop UI, downloads,
      # DEM conversion dependencies, and the bundled EGM2008 grid.
      - name: Install dependencies
        run: uv sync --extra desktop --extra download --extra convert --dev

      - name: Stage artifacts dir
        run: New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      - name: Build web UI
        working-directory: ui
        run: npm run build

      - name: Build EGM2008 geoid grid for the full desktop release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/geoid | Out-Null
          $archive = "build/geoid/egm2008-5.tar.bz2"
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive "https://downloads.sourceforge.net/project/geographiclib/geoids-distrib/egm2008-5.tar.bz2"
          $magic = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($archive)[0..2])
          if ($magic -ne "BZh") {
            throw "Downloaded EGM2008 archive is not a bzip2 file."
          }
          uv run python scripts/build_geoid_npz.py --model EGM2008 --output build/geoid/egm2008_5.npz $archive

      - name: Build and smoke-test the full desktop exe
        run: pwsh -File scripts/build_windows_desktop_exe.ps1 -SkipUi -Egm2008GeoidNpz build/geoid/egm2008_5.npz

      - name: Stage desktop release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $exeName = "InSAR-Studio-$version.exe"
          Copy-Item dist/insar-prep-desktop.exe "artifacts/$exeName"
          $hash = Get-FileHash -Algorithm SHA256 "artifacts/$exeName"
          Write-Host "Internal SHA256: $($hash.Hash)  $([IO.Path]::GetFileName($hash.Path))"

      - name: Generate Chinese release notes from CHANGELOG
        run: uv run python scripts/extract_changelog_for_release.py --version "${{ github.ref_name }}" --output artifacts/RELEASE_NOTES.md

      - name: Remove legacy checksum asset
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = response.data;
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${tag} does not exist yet; no legacy asset to remove.`);
                return;
              }
              throw error;
            }
            for (const asset of release.assets) {
              if (asset.name === 'SHA256SUMS.txt') {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
                core.info(`Removed legacy checksum asset from ${tag}.`);
              }
            }

      - name: Publish desktop assets to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/RELEASE_NOTES.md
          files: |
            artifacts/InSAR-Studio-*.exe
          fail_on_unmatched_files: true
