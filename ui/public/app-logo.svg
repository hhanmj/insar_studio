<svg id="dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">InSAR Studio</title>
  <desc id="desc">InSAR Studio wordmark with topographic interference contours and satellite orbits.</desc>
  <style>
    .contour-navy { fill: none; stroke: #062f5b; }
    .contour-teal { fill: none; stroke: #079da2; }
    .orbit-gap { fill: none; stroke: #f8fafc; }
    .orbit-navy { fill: none; stroke: #062f5b; }
    .orbit-teal { fill: none; stroke: #0aa6a7; }
    .aoi { fill: #0aa6a7; stroke: #f8fafc; }
    .satellite { fill: #062f5b; stroke: #f8fafc; }
    .satellite-panels { fill: none; stroke: #062f5b; }
    .word-primary { fill: #062f5b; paint-order: stroke fill; }
    .word-accent { fill: #0aa6a7; }
    svg:target .contour-navy, svg:target .orbit-navy { stroke: #8edee0; }
    svg:target .contour-teal, svg:target .orbit-teal { stroke: #22c7c8; }
    svg:target .orbit-gap, svg:target .aoi, svg:target .satellite { stroke: #081421; }
    svg:target .satellite { fill: #d9f4f3; }
    svg:target .satellite-panels { stroke: #d9f4f3; }
    svg:target .word-primary { fill: #dce8f0; stroke: #062f5b; stroke-width: 3.2; }
    svg:target .word-accent { fill: #47d3d1; }
  </style>

  <g transform="translate(10 4) scale(.67)">
    <g stroke-linecap="round" stroke-linejoin="round">
      <path class="contour-navy" stroke-width="8" d="M126 43c-39-1-72 23-80 61-9 42 9 83 44 105 35 22 80 15 108-17 28-32 28-76 5-111-18-27-47-39-77-38Z"/>
      <path class="contour-teal" stroke-width="8" d="M127 60c-31-1-58 18-65 49-7 33 7 66 35 84 28 18 65 12 87-14 23-25 23-61 4-88-14-21-37-31-61-31Z"/>
      <path class="contour-navy" stroke-width="8" d="M128 77c-24 0-45 14-50 38-6 25 5 51 27 65 21 13 49 9 66-11 17-20 18-47 4-68-11-16-29-24-47-24Z"/>
      <path class="contour-teal" stroke-width="8" d="M129 94c-17 0-31 10-35 26-4 18 4 35 18 45 15 9 34 6 46-8 12-13 12-32 2-47-7-11-19-16-31-16Z"/>
      <path class="contour-navy" stroke-width="7" d="M130 110c-10 0-18 6-21 16-2 10 2 21 11 26 9 6 20 4 27-4 7-8 7-19 2-28-5-6-12-10-19-10Z"/>
      <path class="aoi" stroke-width="6" d="M131 121c-7-1-13 4-14 11-1 7 3 13 10 15 7 2 14-2 16-8 3-7-1-15-8-17l-4-1Z"/>
    </g>
    <g stroke-linecap="round">
      <ellipse class="orbit-gap" cx="128" cy="128" rx="111" ry="54" stroke-width="23" transform="rotate(-18 128 128)"/>
      <ellipse class="orbit-navy" cx="128" cy="128" rx="111" ry="54" stroke-width="12" transform="rotate(-18 128 128)"/>
      <ellipse class="orbit-gap" cx="128" cy="128" rx="107" ry="49" stroke-width="21" transform="rotate(61 128 128)"/>
      <ellipse class="orbit-teal" cx="128" cy="128" rx="107" ry="49" stroke-width="11" transform="rotate(61 128 128)"/>
    </g>
    <g class="satellite" stroke-width="4" stroke-linejoin="round" transform="translate(198 70) rotate(28)">
      <rect x="-7" y="-7" width="14" height="14" rx="3"/>
      <path class="satellite-panels" d="M-8-3h-12v6h12M8-3h12v6H8"/>
    </g>
  </g>

  <g font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif" font-weight="700">
    <text class="word-primary" x="194" y="113" font-size="70">InSAR</text>
    <text class="word-accent" x="405" y="113" font-size="64">Studio</text>
  </g>
</svg>
